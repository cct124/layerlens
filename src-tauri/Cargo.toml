[package]
name = "layerlens-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LayerLens Tauri 桌面适配层"

[features]
render-lab = ["dev-mcp", "layerlens-core/render-lab"]
dev-mcp = [
  # 锁定版本的无 WebView WindowBuilder 仍属于 unstable，仅开发测试构建启用。
  "tauri/unstable",
  "dep:rmcp", "dep:axum", "dep:schemars", "dep:tokio-util",
  "dep:uuid", "dep:base64", "dep:reqwest", "dep:ts-rs", "layerlens-core/schema",
  "dep:sysinfo", "dep:png", "dep:sha2", "dep:layerlens-window-probe",
  "tokio/net", "tokio/time", "tokio/macros", "tokio/io-util",
  "rmcp/client", "rmcp/transport-streamable-http-client-reqwest",
]

[lib]
name = "layerlens_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "layerlens"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
layerlens-core.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true, features = ["rt"] }
uuid = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
png = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[[example]]
name = "export_dev_bindings"
required-features = ["dev-mcp"]

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
png.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "=0.35.1", optional = true, default-features = false, features = ["system"] }
layerlens-window-probe = { path = "../crates/layerlens-window-probe", optional = true }
