[workspace]
members = ["crates/layerlens-core", "src-tauri"]
exclude = ["vendor/ag-psd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
ag-psd = "=0.3.0"
layerlens-core = { path = "crates/layerlens-core" }
png = "=0.17.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
tauri = { version = "2.11.5" }
tauri-build = { version = "2.6.3" }
ts-rs = "12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
ag-psd = { path = "vendor/ag-psd" }
