[workspace]
members = ["crates/layerlens-core", "crates/layerlens-window-probe", "src-tauri"]
exclude = ["vendor/ag-psd"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
ag-psd = "=0.3.0"
layerlens-core = { path = "crates/layerlens-core" }
png = "=0.17.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
tauri = { version = "2.11.5" }
tauri-build = { version = "2.6.3" }
tauri-plugin-dialog = { version = "=2.7.3", default-features = false }
tokio = { version = "=1.53.1", features = ["sync"] }
ts-rs = "12.0.1"
schemars = { version = "=1.2.2", features = ["derive"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio-util = "=0.7.19"
uuid = { version = "=1.26.1", features = ["v4"] }
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
ag-psd = { path = "vendor/ag-psd" }
