name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/requirements-dev-mcp.txt
      - name: Prepare isolated test Python
        run: npm run prepare:dev-python
      - name: Install Rust toolchain
        run: rustup show
      - name: Install frontend dependencies
        run: npm ci
      - name: Check source, contracts and tests
        run: npm run check
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Verify production has no development entry
        id: production-gate
        run: npm run test:dev-mcp:desktop -- --app target/release/layerlens.exe --expect-disabled
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: layerlens-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Collect production gate reports
        if: always() && steps.production-gate.outcome != 'skipped'
        run: npm run artifacts:dev-mcp -- --output .local/dev-mcp/ci-artifacts
      - name: Retain production gate reports
        if: always() && steps.production-gate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: layerlens-production-gate-${{ github.run_attempt }}
          path: .local/dev-mcp/ci-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  dev-mcp-windows:
    name: Windows development MCP
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/requirements-dev-mcp.txt
      - name: Prepare isolated test Python
        run: npm run prepare:dev-python
      - name: Install Rust toolchain
        run: rustup show
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare matching WebView2 driver
        id: driver
        run: npm run prepare:dev-mcp
      - name: Check screenshot assembly before GUI tests
        run: npm run test:dev-capture
      - name: Check Konva feature contracts and isolated build
        run: npm run check:render-lab
      - name: Check development feature and runner
        run: |
          npm run check:dev-mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:dev-mcp:scripts
      - name: Build ordinary release for feature isolation
        run: npm run tauri -- build --no-bundle -- --locked
      - name: Build development test application
        run: npm run build:dev-mcp
      - name: Repeat isolated business and WebView scenarios
        timeout-minutes: 15
        run: npm run test:dev-mcp:stability -- --repeat 5
      - name: Verify M2 geometry reload and cleanup scenarios
        timeout-minutes: 15
        run: npm run test:dev-mcp:m2
      - name: Repeat M2 pan chord and snapping scenarios five times each
        timeout-minutes: 15
        run: npm run test:dev-mcp:m2-input
      - name: Repeat M2 bounded cleanup expiry recovery and late responses five times each
        timeout-minutes: 15
        run: npm run test:dev-mcp:m2-cleanup
      - name: Repeat M2 native window focus and shutdown scenarios five times each
        timeout-minutes: 15
        run: npm run test:dev-mcp:m2-window
      - name: Verify production Konva canvas inspection and display
        timeout-minutes: 10
        run: npm run test:dev-mcp:canvas
      - name: Build release development application preserving production binary
        run: npm run build:dev-mcp:release
      - name: Verify release canvas resources with three fixed independent instances
        timeout-minutes: 10
        run: npm run test:dev-mcp:canvas-resources
      - name: Build isolated Konva application with reproducible fixtures
        # 普通开发构建已覆盖正式 Konva 工作区，实验验证另行构建。
        run: |
          npm run fixtures:render-lab
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run desktop:render-lab
      - name: Verify real display environment observations
        timeout-minutes: 5
        run: npm run test:konva -- --workload environment --cases path-100 --repeat 1
      - name: Collect bounded diagnostic artifacts
        if: always() && steps.driver.outcome != 'skipped'
        run: npm run artifacts:dev-mcp -- --output .local/dev-mcp/ci-artifacts
      - name: Add stability summary
        if: always() && steps.driver.outcome != 'skipped'
        run: |
          Get-ChildItem -Path .local/dev-mcp/stability-*/summary.md -ErrorAction SilentlyContinue |
            ForEach-Object { Get-Content -LiteralPath $_.FullName | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
      - name: Retain development reports and screenshots
        if: always() && steps.driver.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: layerlens-dev-mcp-${{ github.run_attempt }}
          # 收集器只输出白名单文件，不上传 instances/、profile、config 或驱动程序。
          path: .local/dev-mcp/ci-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
